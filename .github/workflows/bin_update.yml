name: bin_update

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18 = 北京时间次日凌晨 2 点
  workflow_dispatch:

concurrency:
  group: shellcrash-update-push
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout update branch (ignore if missing)
      uses: actions/checkout@v5
      with:
        ref: update
        fetch-depth: 1
        persist-credentials: false   # 禁用默认凭据（我们用 token push）

    - name: Fetch dev ref
      run: |
        git fetch origin dev

    - name: Apt Update & Update CA
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip curl git tar ca-certificates
        sudo update-ca-certificates
        mkdir -p bin/fix
        cp -f /etc/ssl/certs/ca-certificates.crt bin/fix/ca-certificates.crt

    - name: Update Dashboard
      run: |
        set -euo pipefail
        DASH="$GITHUB_WORKSPACE/bin/dashboard"
        TEMP="$DASH/.tmp"     # 临时目录
        mkdir -p "$TEMP"
        echo "下载面板..."
        # 安全加固：严格校验 TLS 证书（移除 -k）
        curl -fsSL -o "$TEMP/meta_yacd.zip"  https://github.com/MetaCubeX/Yacd-meta/archive/gh-pages.zip
        curl -fsSL -o "$TEMP/meta_xd.zip"     https://github.com/MetaCubeX/metacubexd/archive/gh-pages.zip
        curl -fsSL -o "$TEMP/zashboard.zip"   https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip
        ########################################
        # Yacd-meta
        ########################################
        unzip -o "$TEMP/meta_yacd.zip" -d "$TEMP/yacd" > /dev/null
        # 删除字体文件
        find "$TEMP/yacd" \( -name "*.ttf" -o -name "*.woff" -o -name "*.woff2" \) -delete
        # 确认子目录名称
        subdir=$(find "$TEMP/yacd" -maxdepth 1 -type d ! -path "$TEMP/yacd" | head -n1)
        # 打包
        tar -zcvf "$DASH/meta_yacd.tar.gz" -C "$subdir" . > /dev/null
        ########################################
        # metacubexd
        ########################################
        unzip -o "$TEMP/meta_xd.zip" -d "$TEMP/xd" > /dev/null
        # 删除字体文件
        find "$TEMP/xd" \( -name "*.ttf" -o -name "*.woff" -o -name "*.woff2" \) -delete
        # 确认子目录名称
        subdir=$(find "$TEMP/xd" -maxdepth 1 -type d ! -path "$TEMP/xd" | head -n1)
        # 打包
        tar -zcvf "$DASH/meta_xd.tar.gz" -C "$subdir" . > /dev/null
        ########################################
        # zashboard
        ########################################
        unzip -o "$TEMP/zashboard.zip" -d "$TEMP/zash" > /dev/null
        if [ -d "$TEMP/zash/dist" ]; then
            ZDIR="$TEMP/zash/dist"
        elif [ -d "$TEMP/zash/dist-cdn-fonts/dist" ]; then
            ZDIR="$TEMP/zash/dist-cdn-fonts/dist"
        else
            echo "未找到 dist 目录"
            exit 1
        fi
        # 删除字体文件
        find "$ZDIR" \( -name "*.ttf" -o -name "*.woff" -o -name "*.woff2" \) -delete
        # 保留中性 CNAME 标记文件供本地面板检测（不指向第三方域名）
        echo 'zashboard' > "$ZDIR/CNAME"
        tar -zcvf "$DASH/zashboard.tar.gz" -C "$ZDIR" . > /dev/null
        ########################################
        # 一步清理所有临时文件（核心）
        ########################################
        rm -rf "$TEMP"
        echo "面板更新完成！"

    - name: Update Geodata & Rulesets
      run: |
        set -euo pipefail
        mkdir -p bin/geodata bin/ruleset/mrs bin/ruleset/srs
        cd bin
        # 安全加固：全部下载启用严格 TLS 校验（移除 -k）
        curl -fsSL -o geodata/cn_mini.mmdb https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/Country.mmdb
        curl -fsSL -o geodata/china_ip_list.txt https://raw.githubusercontent.com/ChanthMiao/China-IPv4-List/release/cn.txt
        curl -fsSL -o geodata/china_ipv6_list.txt https://raw.githubusercontent.com/ChanthMiao/China-IPv6-List/release/cn6.txt
        curl -fsSL -o geodata/geosite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
        curl -fsSL -o geodata/srs_geoip_cn.srs https://github.com/DustinWin/ruleset_geodata/releases/download/sing-box-ruleset/cnip.srs
        curl -fsSL -o geodata/srs_geosite_cn.srs https://github.com/DustinWin/ruleset_geodata/releases/download/sing-box-ruleset/cn.srs
        curl -fsSL -o geodata/mrs_geosite_cn.mrs https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs

        # 下载上游规则集并在本仓库 update 分支统一镜像分发（确保运行时零第三方规则源依赖）
        curl -fsSL -o mihomo-ruleset.zip https://github.com/DustinWin/ruleset_geodata/archive/refs/heads/mihomo-ruleset.zip
        curl -fsSL -o sing-box-ruleset.zip https://github.com/DustinWin/ruleset_geodata/archive/refs/heads/sing-box-ruleset.zip

        ##########################################
        # 解压
        unzip -o mihomo-ruleset.zip > /dev/null
        unzip -o sing-box-ruleset.zip > /dev/null

        ##########################################
        # 发布 mihomo 规则集 (bin/ruleset/mrs + geodata/mrs.tar.gz)
        rm -rf ruleset/mrs/*
        if [ -d ruleset_geodata-mihomo-ruleset ]; then
            find ruleset_geodata-mihomo-ruleset -maxdepth 1 -type f \( -name "*.mrs" -o -name "applications.list" \) -exec cp -f {} ruleset/mrs/ \;
            curl -fsSL -o ruleset/mrs/googlefcm.mrs https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/googlefcm.mrs
            curl -fsSL -o ruleset/mrs/steam-cn.mrs "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.mrs"
            tar -zcf geodata/mrs.tar.gz -C ruleset/mrs .
        else
            echo "错误：未找到 ruleset_geodata-mihomo-ruleset"
            exit 1
        fi

        ##########################################
        # 发布 sing-box 规则集 (bin/ruleset/srs + geodata/srs.tar.gz)
        rm -rf ruleset/srs/*
        if [ -d ruleset_geodata-sing-box-ruleset ]; then
            find ruleset_geodata-sing-box-ruleset -maxdepth 1 -type f -name "*.srs" -exec cp -f {} ruleset/srs/ \;
            curl -fsSL -o ruleset/srs/googlefcm.srs https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/googlefcm.srs
            curl -fsSL -o ruleset/srs/steam-cn.srs "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/steam@cn.srs"
            tar -zcf geodata/srs.tar.gz -C ruleset/srs .
        else
            echo "错误：未找到 ruleset_geodata-sing-box-ruleset"
            exit 1
        fi

        # 清理临时解压目录
        rm -rf ruleset_geodata-mihomo-ruleset ruleset_geodata-sing-box-ruleset mihomo-ruleset.zip sing-box-ruleset.zip

        sed -i "s/GeoIP_v=.*/GeoIP_v=$(date '+%Y%m%d')/" version
        echo "数据库、规则集及根证书文件更新完成！"

    - name: Sync dev files into update branch
      run: |
        set -euo pipefail
        # 清理旧目录后从 dev 同步，防止已删除文件残留
        rm -rf public rules
        git archive --format=tar origin/dev ShellCrash.tar.gz version | tar -x -C .
        git archive --format=tar origin/dev install.sh install_en.sh public rules | tar -x -C .

    - name: Rebuild update branch with no history
      run: |
        set -euo pipefail
        # 清理上游已停更的历史旧版 clash(v1.7.1) 与 hfs.exe 残留，保证 update 分支 100% 自主构建
        rm -rf bin/clash bin/hfs
        [ -f bin/version ] && sed -i '/^clash_v=/d' bin/version
        # 生成全量产物 SHA-256 校验清单（供完整性核验）
        rm -f bin/SHA256SUMS
        (
          [ -f ShellCrash.tar.gz ] && sha256sum ShellCrash.tar.gz
          [ -f version ] && sha256sum version
          find bin -type f ! -name 'SHA256SUMS' | sort | xargs -r sha256sum
        ) > bin/SHA256SUMS
        # 彻底删除历史记录
        rm -rf .git
        # 重新初始化仓库
        git init
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name  "github-actions[bot]"
        git add .
        git commit -m "自动更新最新Dashboard、Geodata数据库、规则集及根证书"
        # 强制推送覆盖 update 分支
        git branch -M update
        git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git push -f origin update
        # 刷新 CDN 缓存（同步刷新 @dev 脚本包与 @update 全量静态资源，解决 R1 浮动缓存陈旧问题）
        sleep 60
        for devf in ShellCrash.tar.gz version install.sh install_en.sh; do
          curl -s "https://purge.jsdelivr.net/gh/Siu-Leung/ShellCrash@dev/${devf}" || true
          curl -s "https://purge.jsdelivr.net/gh/Siu-Leung/ShellCrash@update/${devf}" || true
        done
        find bin/dashboard bin/geodata bin/ruleset bin/fix -type f 2>/dev/null | while read -r file; do
          curl -s "https://purge.jsdelivr.net/gh/Siu-Leung/ShellCrash@update/${file}" || true
        done
        curl -s https://purge.jsdelivr.net/gh/Siu-Leung/ShellCrash@update/bin/version || true
        curl -s https://purge.jsdelivr.net/gh/Siu-Leung/ShellCrash@update/bin/SHA256SUMS || true
    - name: Cleanup Workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
