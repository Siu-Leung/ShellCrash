name: core_easy_update

on: 
  workflow_dispatch:
    inputs:
      tag1:
        description: 'meta or singbox or singboxr'
        required: true
        type: string

concurrency:
  group: shellcrash-core-easy-${{ inputs.tag1 }}
  cancel-in-progress: false

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - id: get_version
        env:
          CORE_NAME: ${{ inputs.tag1 }}
        run: |
          set -euo pipefail
          case "$CORE_NAME" in
            meta) repo="MetaCubeX/mihomo" ;;
            singbox|singboxr) repo="SagerNet/sing-box" ;;
            *) echo "Invalid core: $CORE_NAME" >&2; exit 1 ;;
          esac
          latest_tag=$(curl -fsSL "https://api.github.com/repos/$repo/releases/latest" | jq -r .tag_name)
          [ -n "$latest_tag" ] && [ "$latest_tag" != "null" ] || { echo "Failed to resolve latest tag" >&2; exit 1; }
          [ "$CORE_NAME" = singboxr ] && latest_tag="${latest_tag}-reF1nd"
          echo "version=$latest_tag" >> "$GITHUB_OUTPUT"
          
  update_meta_upx:
    if: github.event.inputs.tag1 == 'meta'
    needs: get_version
    permissions:
      contents: write
      actions: write
    uses: Siu-Leung/ShellCrash/.github/workflows/update_meta_core.yaml@dev
    with:
      tag1: MetaCubeX/mihomo
      tag2: ${{ needs.get_version.outputs.version }}
      tag4: meta
      tag5: ""
      tag6: upx
    secrets: inherit

  update_meta_tar:
    if: github.event.inputs.tag1 == 'meta'
    needs: [get_version, update_meta_upx]
    permissions:
      contents: write
      actions: write
    uses: Siu-Leung/ShellCrash/.github/workflows/update_meta_core.yaml@dev
    with:
      tag1: MetaCubeX/mihomo
      tag2: ${{ needs.get_version.outputs.version }}
      tag4: meta
      tag5: no_tailscale
      tag6: tar.gz
    secrets: inherit
    
  update_singboxr_upx:
    if: github.event.inputs.tag1 == 'singboxr'
    needs: get_version
    permissions:
      contents: write
      actions: write
    uses: Siu-Leung/ShellCrash/.github/workflows/update_singbox_core.yaml@dev
    with:
      tag1: reF1nd/sing-box
      tag2: ${{ needs.get_version.outputs.version }}
      tag4: singboxr
      tag5: with_quic,with_utls,with_clash_api
      tag6: upx
    secrets: inherit

  update_singboxr_tar:
    if: github.event.inputs.tag1 == 'singboxr'
    needs: [get_version, update_singboxr_upx]
    permissions:
      contents: write
      actions: write
    uses: Siu-Leung/ShellCrash/.github/workflows/update_singbox_core.yaml@dev
    with:
      tag1: reF1nd/sing-box
      tag2: ${{ needs.get_version.outputs.version }}
      tag4: singboxr
      tag5: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale
      tag6: tar.gz
    secrets: inherit

  update_singbox_upx:
    if: github.event.inputs.tag1 == 'singbox'
    needs: get_version
    permissions:
      contents: write
      actions: write
    uses: Siu-Leung/ShellCrash/.github/workflows/update_singbox_core.yaml@dev
    with:
      tag1: SagerNet/sing-box
      tag2: ${{ needs.get_version.outputs.version }}
      tag4: singbox
      tag5: with_quic,with_utls,with_clash_api
      tag6: upx
    secrets: inherit

  update_singbox_tar:
    if: github.event.inputs.tag1 == 'singbox'
    needs: [get_version, update_singbox_upx]
    permissions:
      contents: write
      actions: write
    uses: Siu-Leung/ShellCrash/.github/workflows/update_singbox_core.yaml@dev
    with:
      tag1: SagerNet/sing-box
      tag2: ${{ needs.get_version.outputs.version }}
      tag4: singbox
      tag5: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale
      tag6: tar.gz
    secrets: inherit
